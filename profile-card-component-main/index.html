<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Profile card component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <link rel="stylesheet" href="style.css">

</head>
<body>
  <div class="box">
  <div class="profile-picture">
    <img src="/profile-card-component-main/images/bg-pattern-card.svg">
    <img src="/profile-card-component-main/images/image-victor.jpg">
  </div>
  <div class="profile-name">
    <h1>Victor crest <span>26</span></h1>
    <p>London</p>
  </div>
  <div class="profile-status">
    <div>
      <h1>80k <span>Followers</span></h1>
    </div>
    <div>
      <h1>803k <span>Likes</span></h1>
    </div>
    <div>
      <h1>1.4k <span>photos</span></h1>
    </div>
  </div>
    
</div>
</body>
</html>
