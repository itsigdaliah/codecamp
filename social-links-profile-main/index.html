<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Social links profile</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
 body{
  font-family: sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  display: flex;
  background-color: rgba(0, 0, 0, 0.945);
  cursor: zoom-in;
 }
 .social-media{
  display: flex;
  flex-direction: column;
 }
 .profile{
  margin-bottom: 10px;
  width: 200px;
  margin-left: auto;
  margin-right: auto;
  color: white;
  background-color: gray;
  border-radius: 8px;
  border-style: solid;
  padding-top: 8px;
  padding-bottom: 8px;
  border-radius: 5px;
  border-width: 1px;
  border: none; }

  .profile:hover{
    background-color: yellow;
    cursor: pointer;
  }

 
 .box{
  background-color: rgb(59, 58, 58);
  position: absolute;
 }
 .profile-picture{
  width: 80px;
  height: 80px;
  border-radius: 50%;
  object-fit: contain;
  margin-left: auto;
  margin-right: auto;
  display: block;
  margin-top: 20px;
  
 }
 .name{
  text-align: center;
  font-size: 20px;
  margin-bottom: 10px;
  color: white;
 }
 .location{
  margin-top: 10px;
  text-align: center;
  color: yellow;
  font-size:12px ;
 }
 .description{
  font-weight: normal;
  color: rgba(255, 255, 255, 0.596);
  text-align: center;
  font-size: 10px;
  
 }
 .letter{
  width: 250px;
 }
 .social-media{
  margin-bottom: 20px;
 }
 
 
 
  </style>
</head>
<body>
  <div class="box">
    <img class="profile-picture" src="assets/images/1500chiron01.jpg" >
    <p class="name">
      Bugatti Chiron
    </p>
    <p class="location">
      Brickell, Miami
    </p>
    <div class="letter">
      <h5 class="description">
        'My Best Place To Visit.''
      </h5>
    </div>
    
    <div class="social-media">
      <button class="profile">
        GitHub
      </button>
      <button class="profile">
        Frontend Mentor
      </button>
      <button class="profile">
      LinkedIn
      </button>
      <button class="profile">
        Twitter
      </button>
      <button class="profile">
        Instagram
      </button>
    </div>
   
  </div>

</body>
</html>
